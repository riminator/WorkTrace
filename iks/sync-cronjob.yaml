# iks/sync-cronjob.yaml
# Daily CronJob: syncs in-cluster Postgres → Supabase Postgres.
# Runs at 02:00 UTC every night using the same backend image.
#
# Identical to openshift/sync-cronjob.yaml — no OCP-specific fields.
#
# Apply (once):
#   kubectl apply -f iks/sync-cronjob.yaml
#
# Trigger manually to test:
#   kubectl create job supabase-sync-manual --from=cronjob/worktrace-supabase-sync
#   kubectl logs -f job/supabase-sync-manual
#
# Check scheduled runs:
#   kubectl get cronjob worktrace-supabase-sync
#   kubectl get jobs -l app=worktrace-supabase-sync

apiVersion: batch/v1
kind: CronJob
metadata:
  name: worktrace-supabase-sync
  labels:
    app: worktrace-supabase-sync
spec:
  schedule: "0 2 * * *"          # 02:00 UTC every night
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: worktrace-supabase-sync
        spec:
          restartPolicy: OnFailure
          containers:
            - name: sync
              image: quay.io/akshaymallibm/knowledgebase-backend:latest
              imagePullPolicy: Always
              command:
                - python
                - -m
                - kb.sync_supabase
              envFrom:
                - secretRef:
                    name: knowledgebase-secrets
              resources:
                requests:
                  cpu: "100m"
                  memory: "256Mi"
                limits:
                  cpu: "500m"
                  memory: "512Mi"
