# iks/backend.yaml
# Deployment + ClusterIP Service for the FastAPI backend.
# Identical to openshift/backend.yaml — no OCP-specific fields.
#
# Apply:
#   kubectl apply -f iks/backend.yaml

apiVersion: apps/v1
kind: Deployment
metadata:
  name: knowledgebase-backend
  labels:
    app: knowledgebase-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: knowledgebase-backend
  template:
    metadata:
      labels:
        app: knowledgebase-backend
    spec:
      containers:
        - name: api
          image: quay.io/akshaymallibm/knowledgebase-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              protocol: TCP
          envFrom:
            - secretRef:
                name: knowledgebase-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 30
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: knowledgebase-backend
  labels:
    app: knowledgebase-backend
spec:
  type: ClusterIP
  selector:
    app: knowledgebase-backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
