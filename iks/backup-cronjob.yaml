# iks/backup-cronjob.yaml
# Daily pg_dump CronJob. Runs at 23:55 every night, writes a timestamped SQL
# file to a dedicated PVC. Keeps the last 7 dumps (older ones are pruned).
#
# Differences from openshift/backup-cronjob.yaml:
#   - storageClassName: ibmc-block-gold  (IKS free default block storage)
#   - Removed serviceAccountName: postgres-sa (not needed on IKS)
#
# Apply (once):
#   kubectl apply -f iks/backup-cronjob.yaml
#
# Trigger manually to test:
#   kubectl create job db-backup-manual --from=cronjob/worktrace-db-backup
#   kubectl logs -f job/db-backup-manual
#
# Check scheduled runs:
#   kubectl get cronjob worktrace-db-backup
#   kubectl get jobs -l app=worktrace-db-backup

# ── PVC to hold backup files ──────────────────────────────────────────────────
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-backups
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ibmc-block-gold
  resources:
    requests:
      storage: 2Gi
---
# ── CronJob ───────────────────────────────────────────────────────────────────
apiVersion: batch/v1
kind: CronJob
metadata:
  name: worktrace-db-backup
  labels:
    app: worktrace-db-backup
spec:
  schedule: "55 23 * * *"        # 23:55 every night (UTC)
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: worktrace-db-backup
        spec:
          restartPolicy: OnFailure
          containers:
            - name: pgdump
              image: pgvector/pgvector:pg16
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  OUTFILE="/backups/backup_$(date +%Y%m%d_%H%M%S).sql"
                  echo "▶ Dumping to $OUTFILE"
                  pg_dump -U "$POSTGRES_USER" "$POSTGRES_DB" > "$OUTFILE"
                  echo "  ✓ Done."
                  # Prune — keep only the 7 most recent files
                  ls -1t /backups/backup_*.sql | tail -n +8 | xargs -r rm --
                  echo "  ✓ Old backups pruned (keeping last 7)."
              env:
                - name: PGHOST
                  value: knowledgebase-postgres
                - name: PGPORT
                  value: "5432"
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-credentials
                      key: POSTGRES_PASSWORD
              envFrom:
                - secretRef:
                    name: postgres-credentials
              volumeMounts:
                - name: backups
                  mountPath: /backups
              resources:
                requests:
                  cpu: "100m"
                  memory: "128Mi"
                limits:
                  cpu: "500m"
                  memory: "256Mi"
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: postgres-backups
